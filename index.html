<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học Tiếng Hàn cùng Nga</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      background-color: #f8fafc;
    }

    /* --- SIDEBAR TRÁI --- */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      gap: 12px;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.02);
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 4px 8px 14px 8px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }

    /* Menu item chính */
    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .menu-tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .menu-tab:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .menu-tab.active {
      background-color: #16a34a; /* Xanh lá */
      color: #ffffff;
    }

    .tab-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tab-icon {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
    }

    .arrow {
      font-size: 0.75rem;
      transition: transform 0.2s ease;
    }

    .menu-tab.collapsed .arrow {
      transform: rotate(-90deg);
    }

    /* Submenu danh sách bài con */
    .submenu {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 20px;
      margin-top: 4px;
      transition: all 0.2s ease;
    }

    .submenu.hidden {
      display: none !important;
    }

    .submenu a {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #64748b;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .submenu a:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .submenu a.selected {
      background-color: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
    }

    /* --- KHUNG HIỂN THỊ NỘI DUNG (IFRAME) --- */
    .content-area {
      flex: 1;
      height: 100%;
      background: #ffffff;
      position: relative;
    }

    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      📚 Học Tiếng Hàn cùng Nga
    </div>

    <!-- Nhóm 1: Vocab Trường học -->
    <div class="menu-group">
      <button class="menu-tab active" id="toggleSchool" onclick="toggleSubmenu('submenuSchool', 'toggleSchool')">
        <div class="tab-title">
          <span class="tab-icon">🏫</span>
          <span>Vocab Trường học</span>
        </div>
        <span class="arrow">▼</span>
      </button>

      <!-- Submenu Trường học -->
      <div class="submenu" id="submenuSchool">
        <a href="./vocab2.1/" target="lesson-frame" onclick="setActiveLink(this)">
          • Vocab 2.1
        </a>
        <a href="./vocab2.2/" target="lesson-frame" onclick="setActiveLink(this)">
          • Vocab 2.2
        </a>
      </div>
    </div>

    <!-- Nhóm 2: Vocab Ngày & Số -->
    <div class="menu-group">
      <button class="menu-tab active" id="toggleDate" onclick="toggleSubmenu('submenuDate', 'toggleDate')">
        <div class="tab-title">
          <span class="tab-icon">🗓️</span>
          <span>Vocab Ngày & Số</span>
        </div>
        <span class="arrow">▼</span>
      </button>

      <!-- Submenu Ngày & Số -->
      <div class="submenu" id="submenuDate">
        <a href="./vocab4.1/" target="lesson-frame" class="selected" onclick="setActiveLink(this)">
          • Vocab 4.1: Ngày & Thời gian
        </a>
        <a href="./vocab4.2/" target="lesson-frame" onclick="setActiveLink(this)">
          • Vocab 4.2: Số Hán Hàn
        </a>
      </div>
    </div>
  </aside>

  <!-- Khung iframe hiển thị bài học tràn viền -->
  <main class="content-area">
    <iframe name="lesson-frame" id="mainFrame" class="content-frame" src="./vocab4.1/"></iframe>
  </main>

  <script>
    function toggleSubmenu(submenuId, toggleBtnId) {
      const submenu = document.getElementById(submenuId);
      const toggleBtn = document.getElementById(toggleBtnId);
      
      if (submenu && toggleBtn) {
        submenu.classList.toggle('hidden');
        toggleBtn.classList.toggle('collapsed');
      }
    }

    function setActiveLink(element) {
      const links = document.querySelectorAll('.submenu a');
      links.forEach(link => link.classList.remove('selected'));
      element.classList.add('selected');
    }
  </script>

</body>
</html>
